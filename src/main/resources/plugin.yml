name: comebackKits
version: 1.0
main: com.senin.comebackkits.ComebackKits
api-version: '1.21'
commands:
  kit:
    description: Kit menüsünü açar
    usage: /kit
  rutbever:
    description: Oyuncuya rütbe verir (VIP, VIP+, MVIP, WVIP)
    usage: /rutbever <rütbe> <oyuncu>
